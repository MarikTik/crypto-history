[tool.black]
line-length = 80
target-version = ["py312"]
skip-string-normalization = false
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 80
known_first_party = ["your_project"]  # <-- change to your actual package/module name
known_third_party = ["aiohttp", "asyncio", "json", "datetime", "typing"]  # extend as needed
combine_as_imports = true
force_sort_within_sections = true

[tool.flake8]
max-line-length = 80
extend-ignore = [
    "E203",  # conflicts with black
    "W503"   # line break before binary operator
]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    ".mypy_cache",
]
max-complexity = 10
show-source = true

[tool.mypy]
python_version = 3.12
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
strict_optional = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
show_error_codes = true
pretty = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests"
]

[tool.ruff]
line-length = 80
exclude = [
    ".git",
    "__pycache__",
    ".mypy_cache",
    ".venv",
]
select = [
    "E", "F", "W", "I",  # pycodestyle, pyflakes, isort
]
ignore = ["E203", "W503"]  # like flake8

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
